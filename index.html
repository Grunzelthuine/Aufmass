<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material-Aufmaß</title>
<meta name="theme-color" content="#152238">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufmaß">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <button id="btnBack" class="icon-btn" hidden aria-label="Zurück">←</button>
    <h1 id="headerTitle">Material-Aufmaß</h1>
    <button id="btnNew" class="icon-btn" aria-label="Neues Aufmaß">＋</button>
  </div>
</header>

<main id="app"></main>

<div id="updateBanner" class="update-banner" hidden>
  <span>Neue Version verfügbar.</span>
  <button id="btnUpdate" class="btn btn-secondary">Jetzt aktualisieren</button>
</div>

<div id="scannerOverlay" class="scanner-overlay" hidden>
  <div class="scanner-box">
    <div class="scanner-header">
      <span>Barcode scannen</span>
      <button type="button" id="btnScannerSchliessen" class="icon-btn" aria-label="Schließen">✕</button>
    </div>
    <div id="scannerReader"></div>
    <p id="scannerHinweis" class="hint">Kamera wird gestartet…</p>
    <div class="scanner-manuell">
      <label>Kein Treffer? Nummer manuell eingeben
        <div class="scanner-manuell-row">
          <input type="text" id="scannerManuellInput" inputmode="numeric" placeholder="EAN oder Artikelnummer">
          <button type="button" class="btn btn-secondary" id="scannerManuellBtn">Suchen</button>
        </div>
      </label>
    </div>
  </div>
</div>

<!-- Vorlage: Übersicht -->
<template id="tpl-uebersicht">
  <section class="view">
    <div class="section-heading-row">
      <h2>Aufmaße</h2>
    </div>
    <div id="listeLeer" class="empty-state" hidden>
      <p>Noch kein Aufmaß erfasst.</p>
      <button class="btn btn-primary" data-action="new">Erstes Aufmaß anlegen</button>
    </div>
    <ul id="aufmassListe" class="card-list"></ul>

    <div class="section-heading-row section-heading-row-spaced">
      <h2>Bauaufmaße</h2>
      <button id="btnNewBauaufmass" class="btn-add-inline" aria-label="Neues Bauaufmaß">＋</button>
    </div>
    <p id="bauaufmasseLeer" class="hint" hidden>Noch kein Bauaufmaß angelegt.</p>
    <ul id="bauaufmassListe" class="card-list"></ul>
    <button type="button" id="btnProduktliste" class="btn-link-accent">⚙ Produktliste</button>

    <div class="section-heading-row section-heading-row-spaced">
      <h2>Packlisten</h2>
      <button id="btnNewPackliste" class="btn-add-inline" aria-label="Neue Packliste">＋</button>
    </div>
    <p id="packlistenLeer" class="hint" hidden>Noch keine Packliste angelegt.</p>
    <ul id="packlistenListe" class="card-list"></ul>
  </section>
</template>

<!-- Vorlage: Formular -->
<template id="tpl-formular">
  <section class="view">
    <details class="section-card" open>
      <summary>Kunde &amp; Baustelle</summary>
      <div class="field-grid">
        <label>Kunde / Firma
          <input type="text" id="f_kundeName" placeholder="z. B. Mustermann GmbH">
        </label>
        <label>Ansprechpartner
          <input type="text" id="f_ansprechpartner" placeholder="optional">
        </label>
        <label>Straße, Nr.
          <input type="text" id="f_strasse" placeholder="optional">
        </label>
        <label>PLZ, Ort
          <input type="text" id="f_plzOrt" placeholder="optional">
        </label>
        <label>Telefon
          <input type="tel" id="f_telefon" placeholder="optional">
        </label>
        <label>Baustelle / Bauvorhaben
          <input type="text" id="f_baustelle" placeholder="falls abweichend von Adresse">
        </label>
      </div>
    </details>

    <details class="section-card" open>
      <summary>Datum &amp; Arbeitsbeschreibung</summary>
      <div class="field-grid">
        <label>Datum
          <input type="date" id="f_datum">
        </label>
      </div>
      <label class="full">Arbeitsbeschreibung
        <textarea id="f_arbeitsbeschreibung" rows="3" placeholder="Was wurde / wird ausgeführt?"></textarea>
      </label>
    </details>

    <details class="section-card" open>
      <summary>Material hinzufügen</summary>
      <div id="materialHinzufuegenAufmass"></div>
    </details>

    <details class="section-card" open>
      <summary>Materialliste (<span id="anzahlPositionen">0</span>)</summary>
      <div class="table-scroll">
        <table id="materialTabelle">
          <thead>
            <tr>
              <th>Bezeichnung</th>
              <th>Menge</th>
              <th>Einh.</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="materialTbody"></tbody>
        </table>
      </div>
      <p id="materialLeerHinweis" class="hint" hidden>Noch kein Material erfasst.</p>
    </details>

    <div class="action-bar">
      <button class="btn btn-outline" id="btnLoeschen" hidden>Aufmaß löschen</button>
      <button class="btn btn-primary" id="btnPdf">Als PDF exportieren</button>
    </div>
    <p class="autosave-hint">Änderungen werden automatisch gespeichert.</p>
  </section>
</template>

<!-- Wiederverwendbarer Baustein: Material hinzufügen (Tabs Favoriten / Aus Liste / Standardmaterial / Freitext) -->
<template id="tpl-material-tabs">
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="favoriten" role="tab">Favoriten</button>
    <button class="tab active" data-tab="liste" role="tab">Aus Liste</button>
    <button class="tab" data-tab="standard" role="tab">Standardmaterial</button>
    <button class="tab" data-tab="frei" role="tab">Freitext</button>
  </div>

  <div id="tabFavoriten" class="tab-panel" hidden>
    <p class="hint" id="favoritenLeerHinweis" hidden>Noch keine Favoriten – wird automatisch anhand häufig verwendeter Artikel befüllt, sobald du Material aus „Aus Liste“ oder „Standardmaterial“ hinzufügst.</p>
    <div id="favoritenListe" class="standard-liste"></div>
    <div id="ausgewaehlterArtikelFavorit" class="selected-article" hidden></div>
    <div class="field-grid two-col">
      <label>Menge
        <input type="number" id="f_mengeFavorit" step="any" min="0" inputmode="decimal">
      </label>
      <label>Einheit
        <input type="text" id="f_einheitFavorit" readonly>
      </label>
    </div>
    <button class="btn btn-secondary" id="btnAddFavorit" disabled>Hinzufügen</button>
  </div>

  <div id="tabListe" class="tab-panel">
    <div class="autocomplete">
      <div class="suche-mit-scan">
        <input type="text" id="f_suche" placeholder="Artikel suchen (Name, Art.-Nr. oder EAN)" autocomplete="off">
        <button type="button" class="btn-scan" id="btnBarcodeScan" aria-label="Barcode scannen">📷</button>
      </div>
      <ul id="sucheErgebnisse" class="suggest-list" hidden></ul>
    </div>
    <div id="ausgewaehlterArtikel" class="selected-article" hidden></div>
    <div id="eanNeuForm" class="selected-article" hidden>
      <p class="hint" id="en_hinweis" style="margin-top:0"></p>
      <div class="field-grid">
        <label>Produktbeschreibung
          <input type="text" id="en_bezeichnung" placeholder="z. B. Abzweigdose AP 80x80 grau" autocomplete="off">
        </label>
        <label>Einheit
          <input type="text" id="en_einheit" value="Stck" list="en_einheiten" autocomplete="off">
        </label>
      </div>
      <datalist id="en_einheiten">
        <option value="Stck"></option><option value="m"></option><option value="Pack"></option>
        <option value="Rolle"></option><option value="Satz"></option><option value="kg"></option>
      </datalist>
      <div class="action-bar" style="margin-top:8px">
        <button type="button" class="btn btn-secondary" id="en_anlegen" disabled>Artikel anlegen</button>
        <button type="button" class="btn-danger-text" id="en_abbrechen">Abbrechen</button>
      </div>
    </div>
    <button type="button" class="btn-link-accent" id="btnZuStandardOeffnen" hidden>+ Zu Standardmaterial übernehmen</button>
    <div id="standardUebernahmeForm" class="selected-article" hidden>
      <label>Kategorie
        <select id="su_kategorie"></select>
      </label>
      <div id="su_kategorieNeuWrap" class="field-grid" hidden>
        <label>Neue Kategorie
          <input type="text" id="su_kategorieNeu" placeholder="Name der neuen Kategorie">
        </label>
      </div>
      <div class="field-grid two-col" style="margin-top:8px">
        <label>Bezeichnung
          <input type="text" id="su_bezeichnung">
        </label>
        <label>Einheit
          <input type="text" id="su_einheit">
        </label>
      </div>
      <div class="action-bar" style="margin-top:8px">
        <button type="button" class="btn btn-secondary" id="su_uebernehmen">Übernehmen</button>
        <button type="button" class="btn-danger-text" id="su_abbrechen">Abbrechen</button>
      </div>
      <p class="hint" id="su_bestaetigung" hidden>✓ Zu Standardmaterial hinzugefügt.</p>
    </div>
    <div class="field-grid two-col">
      <label>Menge
        <input type="number" id="f_mengeListe" step="any" min="0" inputmode="decimal">
      </label>
      <label>Einheit
        <input type="text" id="f_einheitListe" readonly>
      </label>
    </div>
    <button class="btn btn-secondary" id="btnAddListe" disabled>Hinzufügen</button>
  </div>

  <div id="tabStandard" class="tab-panel" hidden>
    <p class="hint" id="standardExportHinweis" hidden></p>
    <input type="text" id="f_sucheStandard" placeholder="Suchen oder nach Kategorie durchsuchen…" autocomplete="off">
    <div id="standardListe" class="standard-liste"></div>
    <div id="ausgewaehlterArtikelStandard" class="selected-article" hidden></div>
    <div class="field-grid two-col">
      <label>Menge
        <input type="number" id="f_mengeStandard" step="any" min="0" inputmode="decimal">
      </label>
      <label>Einheit
        <input type="text" id="f_einheitStandard" readonly>
      </label>
    </div>
    <button class="btn btn-secondary" id="btnAddStandard" disabled>Hinzufügen</button>
  </div>

  <div id="tabFrei" class="tab-panel" hidden>
    <label class="full">Bezeichnung
      <input type="text" id="f_bezeichnungFrei" placeholder="z. B. Verlegerohr M25 grau">
    </label>
    <div class="field-grid two-col">
      <label>Menge
        <input type="number" id="f_mengeFrei" step="any" min="0" inputmode="decimal">
      </label>
      <label>Einheit
        <input type="text" id="f_einheitFrei" placeholder="Stk, m, ...">
      </label>
    </div>
    <button class="btn btn-secondary" id="btnAddFrei">Hinzufügen</button>
  </div>
</template>

<!-- Vorlage: Packliste -->
<template id="tpl-packliste">
  <section class="view">
    <details class="section-card" open>
      <summary>Packliste</summary>
      <div class="field-grid">
        <label class="full">Bezeichnung
          <input type="text" id="p_bezeichnung" placeholder="z. B. Baustelle Müller / KW38">
        </label>
        <label>Datum
          <input type="date" id="p_datum">
        </label>
      </div>
    </details>

    <details class="section-card" open>
      <summary>Material hinzufügen</summary>
      <div id="materialHinzufuegenPackliste"></div>
    </details>

    <details class="section-card" open>
      <summary>Noch zu packen (<span id="packlisteAnzahlOffen">0</span>)</summary>
      <div class="table-scroll">
        <table id="packlisteOffenTabelle">
          <thead>
            <tr>
              <th></th>
              <th>Bezeichnung</th>
              <th>Menge</th>
              <th>Einh.</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="packlisteOffenTbody"></tbody>
        </table>
      </div>
      <p id="packlisteOffenLeer" class="hint" hidden>Alles eingepackt.</p>
    </details>

    <details class="section-card" id="packlisteGepacktDetails">
      <summary>Bereits gepackt (<span id="packlisteAnzahlGepackt">0</span>)</summary>
      <div class="table-scroll">
        <table id="packlisteGepacktTabelle">
          <thead>
            <tr>
              <th></th>
              <th>Bezeichnung</th>
              <th>Menge</th>
              <th>Einh.</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="packlisteGepacktTbody"></tbody>
        </table>
      </div>
    </details>

    <div class="action-bar">
      <button class="btn btn-outline" id="btnPacklisteLoeschen" hidden>Packliste löschen</button>
    </div>
    <p class="autosave-hint">Änderungen werden automatisch gespeichert.</p>
  </section>
</template>

<!-- Vorlage: Bauaufmaß (v10) -->
<template id="tpl-bauaufmass">
  <section class="view">
    <details class="section-card" open>
      <summary>Kunde &amp; Baustelle</summary>
      <div class="field-grid">
        <label>Kunde / Firma
          <input type="text" id="b_kundeName" placeholder="z. B. Mustermann GmbH">
        </label>
        <label>Ansprechpartner
          <input type="text" id="b_ansprechpartner" placeholder="optional">
        </label>
        <label>Straße, Nr.
          <input type="text" id="b_strasse" placeholder="optional">
        </label>
        <label>PLZ, Ort
          <input type="text" id="b_plzOrt" placeholder="optional">
        </label>
        <label>Telefon
          <input type="tel" id="b_telefon" placeholder="optional">
        </label>
        <label>Baustelle / Bauvorhaben
          <input type="text" id="b_baustelle" placeholder="falls abweichend von Adresse">
        </label>
      </div>
    </details>

    <details class="section-card" open>
      <summary>Arbeitsbeschreibung</summary>
      <label class="full">
        <textarea id="b_arbeitsbeschreibung" rows="3" placeholder="z. B. Elektroinstallation Neubau EFH"></textarea>
      </label>
      <p class="hint" id="b_datumHinweis"></p>
    </details>

    <details class="section-card" open>
      <summary>Abdeckung &amp; Rahmen</summary>
      <div id="b_abdeckung" class="abdeckung-einstellung"></div>
      <p class="hint">Gilt für Steckdosen, Schalter/Taster, Datendosen, Blindabdeckungen und Rahmen. Abweichungen je Raum oder je Position im Raum möglich.</p>
    </details>

    <details class="section-card" open>
      <summary>Etagen &amp; Räume</summary>
      <p id="b_etagenLeer" class="hint" hidden>Noch keine Etage – unten eine Etage hinzufügen.</p>
      <div id="b_etagen" class="etagen-liste"></div>
      <div id="b_etageAuswahl"></div>
    </details>

    <details class="section-card" open>
      <summary>Verteilungen</summary>
      <p id="b_verteilungenLeer" class="hint" hidden>Noch keine Verteilung.</p>
      <ul id="b_verteilungen" class="raum-liste"></ul>
      <div id="b_verteilungAuswahl"></div>
    </details>

    <div class="action-bar">
      <button class="btn btn-outline" id="btnBauLoeschen" hidden>Bauaufmaß löschen</button>
      <button class="btn btn-primary" id="btnBauPdf">Als PDF exportieren</button>
    </div>
    <p class="autosave-hint">Änderungen werden automatisch gespeichert.</p>
  </section>
</template>

<!-- Vorlage: Raum im Bauaufmaß (v10) -->
<template id="tpl-raum">
  <section class="view">
    <div class="section-card raum-kopf-karte">
      <div class="field-grid">
        <label><span>Raum · Etage <span id="r_etage"></span></span>
          <input type="text" id="r_name">
        </label>
      </div>
      <div id="r_abdeckung"></div>
    </div>

    <details class="section-card" open>
      <summary><span>Beleuchtung (<span id="r_anzahlSchaltungen">0</span>)</span></summary>
      <p id="r_schaltungenLeer" class="hint" hidden>Noch keine Schaltung – unten Schaltungsart wählen.</p>
      <div id="r_schaltungen" class="schaltungen-liste"></div>
      <div id="r_schaltungAuswahl"></div>
    </details>

    <details class="section-card" open>
      <summary><span>Rollos (<span id="r_anzahlRollos">0</span>)</span></summary>
      <p id="r_rollosLeer" class="hint" hidden>Noch kein Rollo-Anschluss.</p>
      <div id="r_rollos" class="schaltungen-liste"></div>
      <button type="button" class="chip chip-schaltung" id="r_rolloHinzufuegen">+ Rollo-Anschluss</button>
    </details>

    <details class="section-card" id="r_knxDetails">
      <summary><span>KNX (<span id="r_anzahlKnx">0</span>)</span></summary>
      <p id="r_knxLeer" class="hint" hidden>Noch keine KNX-Komponente.</p>
      <div id="r_knx" class="schaltungen-liste"></div>
      <div id="r_knxAuswahl"></div>
    </details>

    <details class="section-card" id="r_melderDetails">
      <summary><span>Melder (<span id="r_anzahlMelder">0</span>)</span></summary>
      <p id="r_melderLeer" class="hint" hidden>Noch kein Melder.</p>
      <div id="r_melder" class="schaltungen-liste"></div>
      <div id="r_melderAuswahl"></div>
    </details>

    <div id="r_gruppen" class="view"></div>

    <details class="section-card" id="r_abwDetails">
      <summary><span>Abweichende Abdeckung (<span id="r_anzahlAbw">0</span>)</span></summary>
      <p class="hint">Zusätzlich zu den Zählern oben: Positionen mit anderer Abdeckung als im Raum, z. B. 2 Steckdosen in AP-Feuchtraum.</p>
      <p id="r_abwLeer" class="hint" hidden>Keine Abweichungen.</p>
      <div id="r_abw" class="schaltungen-liste"></div>
      <button type="button" class="chip chip-schaltung" id="r_abwHinzufuegen">+ Position mit anderer Abdeckung</button>
    </details>

    <details class="section-card">
      <summary>Weiteres Material hinzufügen</summary>
      <div id="materialHinzufuegenRaum"></div>
    </details>

    <details class="section-card" open>
      <summary><span>Material im Raum (<span id="r_anzahlMaterial">0</span>)</span></summary>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Bezeichnung</th><th>Menge</th><th>Einh.</th><th></th></tr></thead>
          <tbody id="r_materialTbody"></tbody>
        </table>
      </div>
      <p id="r_materialLeer" class="hint" hidden>Kein zusätzliches Material.</p>
    </details>

    <div class="action-bar">
      <button class="btn btn-primary" id="btnRaumFertig">Fertig – zurück zum Bauaufmaß</button>
    </div>
    <div class="action-bar raum-aktionen">
      <button class="btn-link-accent" id="btnRaumKopieren">Raum kopieren</button>
      <button class="btn-danger-text" id="btnRaumLoeschen">Raum löschen</button>
    </div>
    <p class="autosave-hint">Änderungen werden automatisch gespeichert.</p>
  </section>
</template>

<!-- Vorlage: Verteilung im Bauaufmaß (v11) -->
<template id="tpl-verteilung">
  <section class="view">
    <div class="section-card raum-kopf-karte">
      <div class="field-grid">
        <label>Bezeichnung
          <input type="text" id="v_name" placeholder="z. B. HV, UV OG">
        </label>
        <label>Standort
          <input type="text" id="v_standort" placeholder="z. B. HAR / KG">
        </label>
        <label>Typenbezeichnung
          <input type="text" id="v_typ" placeholder="z. B. Hager ZB33S, 3-reihig, 3 Felder">
        </label>
        <label>Bemerkung
          <textarea id="v_bemerkung" rows="2" placeholder="optional"></textarea>
        </label>
      </div>
    </div>

    <details class="section-card" open>
      <summary><span>Positionen (<span id="v_anzahlKomponenten">0</span>)</span></summary>
      <p id="v_komponentenLeer" class="hint" hidden>Noch keine Position – unten auswählen (FI, LS, Reihenklemmen, …).</p>
      <div id="v_komponenten" class="schaltungen-liste"></div>
      <div id="v_auswahl"></div>
    </details>

    <details class="section-card">
      <summary>Weiteres Material hinzufügen</summary>
      <div id="materialHinzufuegenVerteilung"></div>
    </details>

    <details class="section-card" open>
      <summary><span>Material (<span id="r_anzahlMaterial">0</span>)</span></summary>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Bezeichnung</th><th>Menge</th><th>Einh.</th><th></th></tr></thead>
          <tbody id="r_materialTbody"></tbody>
        </table>
      </div>
      <p id="r_materialLeer" class="hint" hidden>Kein zusätzliches Material.</p>
    </details>

    <div class="action-bar">
      <button class="btn btn-primary" id="btnVerteilungFertig">Fertig – zurück zum Bauaufmaß</button>
    </div>
    <div class="action-bar raum-aktionen">
      <span></span>
      <button class="btn-danger-text" id="btnVerteilungLoeschen">Verteilung löschen</button>
    </div>
    <p class="autosave-hint">Änderungen werden automatisch gespeichert.</p>
  </section>
</template>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="bauaufmass.js"></script>
<script src="app.js"></script>
</body>
</html>
